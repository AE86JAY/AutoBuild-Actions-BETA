# File: .github/workflows/test-dingtalk-notify.yml
name: Test DingTalk Notification

on:
  workflow_dispatch:
    inputs:
      test_status:
        description: '测试状态 (success/failure)'
        required: true
        default: 'success'

jobs:
  Notify-Test:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Env
      run: |
        echo "Display_Date=$(date +'%Y/%m/%d %H:%M')" >> $GITHUB_ENV
        echo "Compile_Result=${{ github.event.inputs.test_status }}" >> $GITHUB_ENV
        echo "UPLOAD_RELEASES=true" >> $GITHUB_ENV

    - name: Trigger Success Notification
      if: env.Compile_Result == 'success'
      env:
        DT_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
        DT_SECRET: ${{ secrets.DINGTALK_SECRET }}
      run: |
        TIMESTAMP=$(date +%s%3N)
        SIGN=$(printf "$TIMESTAMP\n$DT_SECRET" | openssl dgst -sha256 -hmac "$DT_SECRET" -binary | base64)
        curl -X POST \
          "https://oapi.dingtalk.com/robot/send?access_token=$DT_TOKEN&timestamp=$TIMESTAMP&sign=$SIGN" \
          -H 'Content-Type: application/json' \
          -d '{
            "msgtype": "markdown",
            "markdown": {
                "title": "🎉 测试成功通知",
                "text": "### ✅ 钉钉通知测试通过 \n\n**🕒 时间**: ${{ env.Display_Date }} \n**📦 仓库**: [${{ github.repository }}](https://github.com/${{ github.repository }}) \n**🔗 触发方式**: 手动测试 \n\n> 💡 此消息仅用于功能验证"
            }
          }'

    - name: Trigger Failure Notification
      if: env.Compile_Result == 'failure'
      env:
        DT_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
        DT_SECRET: ${{ secrets.DINGTALK_SECRET }}
      run: |
        TIMESTAMP=$(date +%s%3N)
        SIGN=$(printf "$TIMESTAMP\n$DT_SECRET" | openssl dgst -sha256 -hmac "$DT_SECRET" -binary | base64)
        curl -X POST \
          "https://oapi.dingtalk.com/robot/send?access_token=$DT_TOKEN&timestamp=$TIMESTAMP&sign=$SIGN" \
          -H 'Content-Type: application/json' \
          -d '{
            "msgtype": "markdown",
            "markdown": {
                "title": "⚠️ 测试失败警报",
                "text": "### ❌ 钉钉通知测试失败 \n\n**🕒 时间**: ${{ env.Display_Date }} \n**📦 仓库**: [${{ github.repository }}](https://github.com/${{ github.repository }}) \n**🔍 日志**: [查看测试详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) \n\n> 🚨 请检查机器人配置！"
            }
          }'