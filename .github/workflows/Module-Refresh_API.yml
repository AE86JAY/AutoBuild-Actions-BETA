###########################################################
#   Description: Refresh Release API                      #
#   Author: Hyy2001X                                      #
###########################################################

name: zzz_Refresh API

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      refresh_switch:
        description: '手动刷新 API'
        default: 'true'

  schedule:
    - cron: 0 4,16 * * *

jobs:
  Job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Download Github Release API
      run: |
        wget https://api.github.com/repos/${{github.repository}}/releases/tags/AutoUpdate -O API
        
    - name: Upload API to Github Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./API
        file_glob: true
        tag: AutoUpdate
        overwrite: true
    - name: Notify Telegram Result
      if: always() && (env.Compile_Result == 'true' || env.Compile_Result == 'false')
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMPILE_STATUS=$([ "${{ env.Compile_Result }}" = "true" ] && echo "✅ 编译成功" || echo "❌ 编译失败")
        MESSAGE="[ASUS RT-ACRH17 固件编译]
        
        状态: $COMPILE_STATUS
        仓库: ${{ github.repository }}
        触发者: ${{ github.actor }}
        分支: ${{ github.ref }}
        时间: ${{ env.Display_Date }}
        详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        curl -s -X POST \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d chat_id="${TG_CHAT_ID}" \
          -d text="${MESSAGE}" \
          -d parse_mode="Markdown" \
          -d disable_notification="false"
