name: 测试钉钉信息推送

on:
  # 允许手动触发测试
  workflow_dispatch:
  # 推送代码到仓库时触发（可选）
  push:
    branches: [ main, master ]

jobs:
  simulate-build:
    runs-on: ubuntu-latest

    steps:
     步骤 1：模拟成功构建
    - name: Simulate Success
      id: success_step
      run: |
        echo "🎉 模拟成功构建..."
        exit 0  # 强制返回成功状态

    # 步骤 2：模拟失败构建（注释掉可跳过）
    - name: Simulate Failure (Uncomment to test)
      if: true  # 默认禁用，需要测试时改为 true
      run: |
        echo "💥 模拟失败构建..."
        exit 1  # 强制返回失败状态

  # 钉钉通知任务（依赖主任务状态）
  notify:
    needs: simulate-build
    runs-on: ubuntu-latest
    # 始终运行，无论主任务是否成功
    if: always()

    steps:
    - name: Notify DingTalk
      env:
        DINGTALK_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}  # 如果启用加签需配置
      run: |
        # 生成动态消息内容
        if [ "${{ job.status }}" == "success" ]; then
          TITLE="✅ 测试成功"
          COLOR="00FF00"
        elif [ "${{ job.status }}" == "failure" ]; then
          TITLE="❌ 测试失败"
          COLOR="FF0000"
        elif [ "${{ job.status }}" == "cancelled" ]; then
          TITLE="⏹️ 测试取消"
          COLOR="FFA500"
        else
          TITLE="⚠️ 未知状态"
          COLOR="808080"
        fi

        # 计算加签（如果启用）
        TIMESTAMP=$(date +%s%3N)
        SIGN=""
        if [ -n "$DINGTALK_SECRET" ]; then
          STRING_TO_SIGN="${TIMESTAMP}\n${DINGTALK_SECRET}"
          SIGN=$(echo -en "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64)
        fi

        # 构造钉钉消息体
        JSON_DATA=$(cat <<EOF
        {
          "msgtype": "markdown",
          "markdown": {
            "title": "${TITLE}",
            "text": "### ${TITLE}\n\n**仓库**: [${{ github.repository }}]($GITHUB_SERVER_URL/${{ github.repository }})\n**触发者**: ${{ github.actor }}\n**状态**: <font color='${COLOR}'>${{ job.status }}</font>\n**时间**: $(date +'%Y/%m/%d %H:%M')\n[查看运行日志]($GITHUB_SERVER_URL/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID)"
          }
        }
        EOF
        )

        # 发送请求（带加签逻辑）
        curl -s -X POST \
          "https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}${SIGN:+&timestamp=$TIMESTAMP&sign=$SIGN}" \
          -H "Content-Type: application/json" \
          -d "${JSON_DATA}"
